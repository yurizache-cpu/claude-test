:root{--cream:#f5f0e8;--cream-dark:#ede6d8;--white:#fefcf8;--sage:#4a6b5d;--sage-light:#6b9b86;--sage-dark:#2d4a3c;--terracotta:#c4755b;--terracotta-light:#d4917c;--charcoal:#2b2d2a;--warm-gray:#8a857d;--sand:#d4cabb;--bg:var(--cream);--surface:#fefcf8d1;--surface-solid:var(--white);--line:#2b2d2a1a;--line-strong:#2b2d2a2e;--text:var(--charcoal);--muted:#5f6159;--faint:var(--warm-gray);--sage-soft:#4a6b5d1a;--serif:"Instrument Serif", Georgia, serif;--sans:"Outfit", system-ui, -apple-system, sans-serif;--ease-out-expo:cubic-bezier(.16, 1, .3, 1)}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;font-size:16px;line-height:1.6;overflow-x:hidden}::selection{background:var(--sage);color:var(--white)}.bg-canvas{z-index:0;pointer-events:none;position:fixed;inset:0}.glow{z-index:0;pointer-events:none;background:radial-gradient(circle,#6b9b8629 0%,#0000 62%);border-radius:50%;width:780px;height:620px;position:fixed;top:-280px;left:50%;transform:translate(-50%)}.hub{z-index:1;flex-direction:column;gap:8px;max-width:560px;margin:0 auto;padding:72px 22px 48px;display:flex;position:relative}.profile{text-align:center;flex-direction:column;align-items:center;margin-bottom:34px;display:flex}.avatar-breath{cursor:pointer;background:0 0;border:none;place-items:center;width:128px;height:128px;margin-bottom:10px;padding:0;display:grid;position:relative}.avatar-breath:focus-visible{outline:2px solid var(--sage);outline-offset:6px;border-radius:50%}.breath-ring{border:1.5px solid #4a6b5d8c;border-radius:50%;animation:7s ease-in-out infinite breathe;position:absolute;inset:0}.breath-ring.delay{border-color:#c4755b59;animation-delay:-3.5s}@keyframes breathe{0%,to{opacity:.95;transform:scale(.84)}50%{opacity:.25;transform:scale(1.1)}}.avatar-photo{object-fit:cover;border:3px solid var(--white);border-radius:50%;width:100px;height:100px;display:block;box-shadow:0 14px 34px #2b2d   // ===========================================================================
  // STATE & PERSISTÊNCIA
  // ===========================================================================
  function initialState() {
    return {
      step: 1,
      demanda: null,
      demandaOutro: '',
      tempo: null,
      impacto: 5,
      impactoTouched: false,
      frequencia: null,
      disclaimer_exibido: 'nenhum',
      escolha_final_apos_disclaimer: 'n_aplica',
      pacote: null,
      nome: '',
      startedAt: null,
      sourcePage: null,
      sourceLabel: null,
      completed: false
    };
  }
  var state = initialState();
  var modalMounted = false;
  var modalEl = null;

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ts: Date.now(), state: state }));
    } catch (e) {}
  }
  function loadSaved() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (!data || !data.ts || !data.state) return null;
      if (Date.now() - data.ts > TTL_MS) {
        localStorage.removeItem(STORAGE_KEY);
        return null;
      }
      if (data.state.completed) {
        localStorage.removeItem(STORAGE_KEY);
        return null;
      }
      return data.state;
    } catch (e) { return null; }
  }
  function clearSaved() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  // ===========================================================================
  // TRACKING (dataLayer)
  // ===========================================================================
  function track(eventName, extra) {
    try {
      var payload = {
        event: eventName,
        triagem_etapa: state.step,
        triagem_demanda: state.demanda,
        triagem_demanda_outro: (state.demanda === 'outro' && state.demandaOutro) ? state.demandaOutro.slice(0, 240) : null,
        triagem_tempo: state.tempo,
        triagem_impacto: state.impacto,
        triagem_frequencia: state.frequencia,
        triagem_pacote: state.pacote,
        triagem_nome: state.nome || null,
        triagem_disclaimer: state.disclaimer_exibido,
        triagem_escolha_apos_disclaimer: state.escolha_final_apos_disclaimer,
        source_page: state.sourcePage
      };
      if (extra) Object.keys(extra).forEach(function (k) { payload[k] = extra[k]; });

      // 1) dataLayer (compatibilidade com GTM, se um dia for usado)
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push(payload);

      // 2) GA4 via gtag — manda o evento com os parâmetros (sem o campo "event", sem nulos)
      if (typeof gtag === 'function') {
        var params = {};
        Object.keys(payload).forEach(function (k) {
          if (k !== 'event' && payload[k] != null) params[k] = payload[k];
        });
        gtag('event', eventName, params);
      }
    } catch (e) {}
  }

  // ===========================================================================
  // HELPERS
  // ===========================================================================
  function severityLevel() {
    if (state.impacto <= 5) return 'leve';
    if (state.impacto <= 7) return 'moderada';
    return 'alta';
  }
  function impactColorClass() {
    if (state.impacto <= 4) return 'is-low';
    if (state.impacto <= 7) return 'is-mid';
    return 'is-high';
  }
  function impactFeedbackText() {
    for (var i = 0; i < IMPACTO_FEEDBACK.length; i++) {
      if (state.impacto <= IMPACTO_FEEDBACK[i].max) return IMPACTO_FEEDBACK[i].text;
    }
    return '';
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function labelDemanda(id) {
    if (id === 'outro') {
      var customText = (state.demandaOutro || '').trim();
      return customText ? ('Outro motivo — ' + customText) : 'Outro motivo';
    }
    for (var i = 0; i < DEMANDAS.length; i++) if (DEMANDAS[i].id === id) return DEMANDAS[i].label;
    return id || '—';
  }
  function labelTempo(id) {
    for (var i = 0; i < TEMPOS.length; i++) if (TEMPOS[i].id === id) return TEMPOS[i].label;
    return id || '—';
  }
  function labelFreq(id) {
    return id === 'semanal' ? 'Semanal' : id === 'quinzenal' ? 'Quinzenal' : '—';
  }
  function labelPacote(id) {
    if (id === 'apenas_avaliacao') return 'Apenas sessão inicial (R$ 97)';
    if (!id || !state.frequencia) return '—';
    var list = PACOTES[state.frequencia] || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return list[i].nome + ' · ' + list[i].sessoes + ' sessões · R$ ' + list[i].total;
    }
    return '—';
  }

  // ===========================================================================
  // MODAL MOUNT (lazy)
  // ===========================================================================
  function mountModal() {
    if (modalMounted) return;

    var style = document.createElement('style');
    style.id = 'yzr-trg-styles';
    style.textContent = CSS;
    document.head.appendChild(style);

    var html = ''
      + '<div id="trgModal" class="trg-modal" role="dialog" aria-modal="true" aria-labelledby="trgTitle">'
      +   '<div class="trg-backdrop" aria-hidden="true"></div>'
      +   '<div class="trg-shell">'
      +     '<header class="trg-header">'
      +       '<div class="trg-progress">'
      +         '<span class="trg-progress-label" id="trgProgressLabel">Etapa 1 de 5</span>'
      +         '<div class="trg-progress-bar" id="trgProgressBar">'
      +           '<span class="trg-progress-seg is-current"></span>'
      +           '<span class="trg-progress-seg"></span>'
      +           '<span class="trg-progress-seg"></span>'
      +           '<span class="trg-progress-seg"></span>'
      +           '<span class="trg-progress-seg"></span>'
      +         '</div>'
      +       '</div>'
      +       '<button type="button" class="trg-close" id="trgClose" aria-label="Fechar triagem">' + ICONS.close + '</button>'
      +     '</header>'
      +     '<div class="trg-body" id="trgBody" tabindex="-1"></div>'
      +     '<footer class="trg-footer" id="trgFooter"></footer>'
      +     '<div class="trg-exit" id="trgExit" hidden>'
      +       '<div class="trg-exit-card">'
      +         '<h3>Tem certeza que quer sair?</h3>'
      +         '<p>Você está a poucos passos de marcar sua avaliação. Suas respostas ficam salvas por 24h se quiser continuar depois.</p>'
      +         '<div class="trg-exit-actions">'
      +           '<button type="button" class="trg-exit-stay" id="trgExitStay">Continuar respondendo</button>'
      +           '<button type="button" class="trg-exit-leave" id="trgExitLeave">Sair mesmo assim</button>'
      +         '</div>'
      +       '</div>'
      +     '</div>'
      +   '</div>'
      + '</div>';

    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    document.body.appendChild(wrap.firstElementChild);
    modalEl = document.getElementById('trgModal');

    document.getElementById('trgClose').addEventListener('click', requestExit);
    document.getElementById('trgExitStay').addEventListener('click', closeExitPrompt);
    document.getElementById('trgExitLeave').addEventListener('click', confirmExit);

    document.addEventListener('keydown', function (e) {
      if (!modalEl || !modalEl.classList.contains('is-open')) return;
      if (e.key === 'Escape') { requestExit(); }
    });

    modalMounted = true;
  }

  // ===========================================================================
  // OPEN / CLOSE
  // ===========================================================================
  function openModal(originalHref, originLink) {
    mountModal();

    var saved = loadSaved();
    if (saved) {
      // Restore but reset impactoTouched if user is back on step 3
      state = Object.assign(initialState(), saved);
      if (!state.startedAt) state.startedAt = Date.now();
    } else {
      state = initialState();
      state.startedAt = Date.now();
    }

    state.sourcePage = (window.location.pathname.split('/').pop() || 'index.html').replace(/\.html$/, '');
    state.sourceLabel = originLink && originLink.innerText ? originLink.innerText.trim().slice(0, 50) : '';

    document.documentElement.classList.add('trg-noscroll');
    document.body.classList.add('trg-noscroll');
    modalEl.classList.add('is-open');

    renderStep();
    track('triagem_iniciada', { source_label: state.sourceLabel });
    // Micro-conversão de observação (só dispara se o label estiver configurado)
    if (typeof window.yzr_event_triagem_iniciada === 'function') {
      window.yzr_event_triagem_iniciada();
    }
  }

  function closeModal() {
    if (!modalEl) return;
    modalEl.classList.remove('is-open');
    document.documentElement.classList.remove('trg-noscroll');
    document.body.classList.remove('trg-noscroll');
    closeExitPrompt();
  }

  function requestExit() {
    if (state.completed || state.step >= 6) { closeModal(); return; }
    var prompt = document.getElementById('trgExit');
    if (prompt) { prompt.hidden = false; prompt.classList.add('is-open'); }
  }
  function closeExitPrompt() {
    var prompt = document.getElementById('trgExit');
    if (prompt) { prompt.hidden = true; prompt.classList.remove('is-open'); }
  }
  function confirmExit() {
    track('triagem_abandonada', { abandonou_etapa: state.step });
    persist();
    closeModal();
  }

  // ===========================================================================
  // PROGRESS BAR
  // ===========================================================================
  function updateProgress() {
    var label = document.getElementById('trgProgressLabel');
    var bar = document.getElementById('trgProgressBar');
    if (!label || !bar) return;
    if (state.step > TOTAL_STEPS) {
      label.textContent = '100% completo';
    } else {
      label.textContent = 'Etapa ' + state.step + ' de ' + TOTAL_STEPS;
    }
    var segs = bar.querySelectorAll('.trg-progress-seg');
    segs.forEach(function (s, i) {
      var n = i + 1;
      s.classList.remove('is-done', 'is-current');
      if (n < state.step || state.step > TOTAL_STEPS) s.classList.add('is-done');
      else if (n === state.step) s.classList.add('is-current');
    });
  }

  // ===========================================================================
  // RENDER (dispatcher)
  // ===========================================================================
  function renderStep() {
    updateProgress();
    var body = document.getElementById('trgBody');
    var footer = document.getElementById('trgFooter');
    if (!body || !footer) return;

    var s = state.step;
    if (s === 1)      body.innerHTML = renderStep1();
    else if (s === 2) body.innerHTML = renderStep2();
    else if (s === 3) body.innerHTML = renderStep3();
    else if (s === 4) body.innerHTML = renderStep4();
    else if (s === 5) body.innerHTML = renderStep5();
    else              body.innerHTML = renderFinal();

    renderFooter();
    bindStepHandlers();
    body.scrollTop = 0;
  }

  function renderFooter() {
    var footer = document.getElementById('trgFooter');
    var s = state.step;
    if (s > TOTAL_STEPS) { footer.innerHTML = ''; footer.style.display = 'none'; return; }
    footer.style.display = 'flex';

    var backBtn = s > 1
      ? '<button type="button" class="trg-btn trg-btn-back" id="trgBack" aria-label="Voltar para etapa anterior">' + ICONS.arrowL + ' Voltar</button>'
      : '<span style="min-width: 92px;"></span>';

    // Etapas 1 e 2 — auto-advance, sem botão next (exceto etapa 1 com "outro")
    // Etapas 3, 4, 5 — botão next obrigatório
    var nextBtn = '';
    if (s === 1 && state.demanda === 'outro') {
      var disabledO = (state.demandaOutro && state.demandaOutro.trim()) ? '' : ' disabled';
      nextBtn = '<button type="button" class="trg-btn trg-btn-next" id="trgNext"' + disabledO + '>Continuar ' + ICONS.arrowR + '</button>';
    } else if (s === 3) {
      var disabled = state.impactoTouched ? '' : ' disabled';
      nextBtn = '<button type="button" class="trg-btn trg-btn-next" id="trgNext"' + disabled + '>Continuar ' + ICONS.arrowR + '</button>';
    } else if (s === 4) {
      var disabled4 = state.frequencia ? '' : ' disabled';
      nextBtn = '<button type="button" class="trg-btn trg-btn-next" id="trgNext"' + disabled4 + '>Continuar ' + ICONS.arrowR + '</button>';
    } else if (s === 5) {
      var disabled5 = state.pacote ? '' : ' disabled';
      nextBtn = '<button type="button" class="trg-btn trg-btn-next" id="trgNext"' + disabled5 + '>Continuar ' + ICONS.arrowR + '</button>';
    } else {
      nextBtn = '<span style="flex:1;"></span>';
    }

    var microcopy = MICROCOPY[s] ? '<span class="trg-microcopy">' + MICROCOPY[s] + '</span>' : '';

    footer.innerHTML = backBtn + nextBtn + microcopy;

    var backEl = document.getElementById('trgBack');
    if (backEl) backEl.addEventListener('click', goBack);
    var nextEl = document.getElementById('trgNext');
    if (nextEl) nextEl.addEventListener('click', advance);
  }

  // ===========================================================================
  // STEP RENDERERS
  // ===========================================================================
  function renderStep1() {
    var opts = DEMANDAS.map(function (d) {
      var sel = state.demanda === d.id ? ' is-selected' : '';
      return '<button type="button" class="trg-option' + sel + '" data-value="' + d.id + '" role="radio" aria-checked="' + (sel ? 'true' : 'false') + '">'
        +   '<span class="trg-option-icon">' + ICONS[d.icon] + '</span>'
        +   '<span class="trg-option-text">' + escapeHtml(d.label) + '</span>'
        +   '<span class="trg-option-check">' + ICONS.check + '</span>'
        + '</button>';
    }).join('');

    var outroPanel = '';
    if (state.demanda === 'outro') {
      var val = state.demandaOutro || '';
      outroPanel = ''
        + '<div class="trg-outro-panel">'
        +   '<label class="trg-outro-label" for="trgOutroInput">Conta pra mim, em poucas palavras, o que tem te trazido aqui'
        +     '<small>Pode ser qualquer coisa que esteja pesando — sem precisar de termos técnicos.</small>'
        +   '</label>'
        +   '<textarea id="trgOutroInput" class="trg-outro-input" maxlength="240" rows="3" placeholder="Ex.: estou em uma transição difícil, perdi alguém recentemente, tenho me sentido distante de mim mesmo...">' + escapeHtml(val) + '</textarea>'
        +   '<span class="trg-outro-count"><span id="trgOutroCount">' + val.length + '</span> / 240</span>'
        + '</div>';
    }

    return ''
      + '<div class="trg-step">'
      +   '<h2 class="trg-step-title" id="trgTitle">Vamos começar pelo <em>essencial</em></h2>'
      +   '<p class="trg-step-subtitle">O que tem te trazido aqui?</p>'
      +   '<div class="trg-options" role="radiogroup" aria-labelledby="trgTitle">' + opts + '</div>'
      +   outroPanel
      + '</div>';
  }

  function renderStep2() {
    var opts = TEMPOS.map(function (t) {
      var sel = state.tempo === t.id ? ' is-selected' : '';
      return '<button type="button" class="trg-option' + sel + '" data-value="' + t.id + '" role="radio" aria-checked="' + (sel ? 'true' : 'false') + '">'
        +   '<span class="trg-option-text">' + escapeHtml(t.label) + '</span>'
        +   '<span class="trg-option-check">' + ICONS.check + '</span>'
        + '</button>';
    }).join('');
    return ''
      + '<div class="trg-step">'
      +   '<h2 class="trg-step-title" id="trgTitle">Há quanto tempo <em>isso vem acontecendo</em>?</h2>'
      +   '<p class="trg-step-subtitle">Não precisa ser preciso. Uma estimativa já ajuda.</p>'
      +   '<div class="trg-options" role="radiogroup" aria-labelledby="trgTitle">' + opts + '</div>'
      + '</div>';
  }

  function renderStep3() {
    var touchedCls = state.impactoTouched ? ' is-touched' : '';
    var colorCls = state.impactoTouched ? ' ' + impactColorClass() : '';
    var displayVal = state.impactoTouched ? state.impacto : '—';

    var feedback = state.impactoTouched
      ? '<div class="trg-impact-feedback ' + impactColorClass() + '">' + escapeHtml(impactFeedbackText()) + '</div>'
      : '<div class="trg-impact-feedback is-empty">Mova o controle para ver a leitura.</div>';

    return ''
      + '<div class="trg-step">'
      +   '<h2 class="trg-step-title" id="trgTitle">O quanto isso tem te <em>tirado do seu eixo</em>?</h2>'
      +   '<p class="trg-step-subtitle">Considere as últimas duas semanas. Pense em trabalho, sono, motivação e relacionamentos.</p>'
      +   '<div class="trg-slider-wrap">'
      +     '<p class="trg-slider-value' + touchedCls + colorCls + '" id="trgSliderValue">' + displayVal + '</p>'
      +     '<p class="trg-slider-suffix">de 0 a 10</p>'
      +     '<div class="trg-slider-track">'
      +       '<input type="range" min="1" max="10" step="1" value="' + state.impacto + '" id="trgSlider" class="trg-slider' + touchedCls + '" aria-label="Nível de impacto, de 1 a 10">'
      +     '</div>'
      +     '<div class="trg-slider-labels"><span>Pouco</span><span>Muito</span></div>'
      +   '</div>'
      +   feedback
      + '</div>';
  }

  function renderStep4() {
    var sel1 = state.frequencia === 'semanal' ? ' is-selected' : '';
    var sel2 = state.frequencia === 'quinzenal' ? ' is-selected' : '';
    var showDisc = state.frequencia === 'quinzenal' && state.disclaimer_exibido !== 'nenhum' && state.escolha_final_apos_disclaimer === 'n_aplica';
    var discCls = state.disclaimer_exibido === 'alta' ? ' is-alta' : '';
    var discText = '';
    if (state.disclaimer_exibido === 'moderada') {
      discText = 'Pelo que você relatou, o <strong>semanal</strong> costuma trazer resultados mais consistentes nas primeiras 4 a 6 semanas. Quinzenal continua sendo uma opção — a gente pode ajustar a frequência ao longo do tratamento.';
    } else if (state.disclaimer_exibido === 'alta') {
      discText = 'Considerando o nível de impacto que você relatou (<strong>' + state.impacto + '/10</strong>), recomendo fortemente começar em <strong>frequência semanal</strong>. A diferença de resultados nas primeiras semanas é significativa. Quinzenal segue sendo uma opção sua, e podemos revisar essa decisão durante o tratamento.';
    }
    var discHtml = showDisc
      ? '<div class="trg-disclaimer' + discCls + '" id="trgDisclaimer" role="alert">'
        +  '<p>' + discText + '</p>'
        +  '<div class="trg-disclaimer-actions">'
        +    '<button type="button" class="trg-disc-keep" id="trgDiscKeep">Manter quinzenal</button>'
        +    '<button type="button" class="trg-disc-switch" id="trgDiscSwitch">Trocar para semanal</button>'
        +  '</div>'
        + '</div>'
      : '';

    return ''
      + '<div class="trg-step">'
      +   '<h2 class="trg-step-title" id="trgTitle">Como você imagina sua <em>rotina</em> de sessões?</h2>'
      +   '<p class="trg-step-subtitle">Não tem certo ou errado. A gente pode ajustar depois.</p>'
      +   '<div class="trg-freq-cards">'
      +     '<button type="button" class="trg-freq-card' + sel1 + '" data-value="semanal" role="radio" aria-checked="' + (sel1 ? 'true' : 'false') + '">'
      +       '<span class="trg-freq-tag">Mais recomendado</span>'
      +       '<h3>Semanal</h3>'
      +       '<p>Uma sessão por semana. Frequência mais comum para resultados consistentes.</p>'
      +     '</button>'
      +     '<button type="button" class="trg-freq-card' + sel2 + '" data-value="quinzenal" role="radio" aria-checked="' + (sel2 ? 'true' : 'false') + '">'
      +       '<h3>Quinzenal</h3>'
      +       '<p>Uma sessão a cada duas semanas. Espaçamento maior entre encontros.</p>'
      +     '</button>'
      +   '</div>'
      +   discHtml
      + '</div>';
  }

  function renderStep5() {
    var freq = state.frequencia || 'semanal';
    var list = PACOTES[freq] || [];
    var cards = list.map(function (p) {
      var sel = state.pacote === p.id ? ' is-selected' : '';
      var pop = p.badge === 'Mais escolhido' ? ' is-popular' : '';
      var badge = p.badge ? '<span class="trg-pkg-badge">' + p.badge + '</span>' : '';
      var economy = '';
      return '<button type="button" class="trg-pkg-card' + sel + pop + '" data-value="' + p.id + '">'
        +   badge
        +   '<div class="trg-pkg-info">'
        +     '<h3>' + escapeHtml(p.nome) + '</h3>'
        +     '<p class="trg-pkg-freq">' + escapeHtml(p.freq) + '</p>'
        +     economy
        +   '</div>'
        +   '<div class="trg-pkg-price">'
        +     '<div class="trg-pkg-price-per"><small>R$</small>' + p.preco + '</div>'
        +     '<div class="trg-pkg-price-suffix">por sessão</div>'
        +     '<div class="trg-pkg-price-total">Total R$ ' + p.total.toLocaleString('pt-BR') + '</div>'
        +   '</div>'
        + '</button>';
    }).join('');
    var evalSel = state.pacote === 'apenas_avaliacao' ? ' is-selected' : '';

    return ''
      + '<div class="trg-step">'
      +   '<h2 class="trg-step-title" id="trgTitle">Qual pacote combina com seu <em>momento</em>?</h2>'
      +   '<p class="trg-step-subtitle">Você sempre começa pela sessão inicial de avaliação (R$ 97). Os pacotes entram em vigor a partir da segunda sessão, depois que conversamos.</p>'
      +   '<div class="trg-packages">' + cards + '</div>'
      +   '<div class="trg-eval-divider"><span>ou começar mais leve</span></div>'
      +   '<button type="button" class="trg-only-eval' + evalSel + '" data-value="apenas_avaliacao">'
      +     '<span class="trg-only-eval-icon" aria-hidden="true">'
      +       '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>'
      +     '</span>'
      +     '<span class="trg-only-eval-body">'
      +       '<span class="trg-only-eval-title">Quero só a sessão inicial primeiro</span>'
      +       '<span class="trg-only-eval-hint">Avaliação de 50 min · sem compromisso com pacote</span>'
      +     '</span>'
      +     '<span class="trg-only-eval-price"><small>R$</small>97</span>'
      +     '<span class="trg-only-eval-arrow" aria-hidden="true">→</span>'
      +   '</button>'
      + '</div>';
  }

  function renderFinal() {
    var summaryHtml = ''
      + summaryRow('Demanda', labelDemanda(state.demanda))
      + summaryRow('Tempo convivendo', labelTempo(state.tempo))
      + summaryRow('Impacto no dia a dia', state.impacto + '/10')
      + summaryRow('Frequência escolhida', labelFreq(state.frequencia))
      + summaryRow('Pacote de interesse', labelPacote(state.pacote));

    var savedName = escapeHtml(state.nome || '');

    return ''
      + '<div class="trg-step">'
      +   '<div class="trg-final-head">'
      +     '<div class="trg-final-orb">' + ICONS.check + '</div>'
      +     '<h2>Tudo certo. <em>Falta só um passo.</em></h2>'
      +     '<p>Em instantes você será redirecionado para o WhatsApp com sua mensagem já estruturada.</p>'
      +   '</div>'
      +   '<div class="trg-summary">' + summaryHtml + '</div>'
      +   '<div class="trg-info-box">'
      +     ICONS.shield
      +     '<div>'
      +       '<strong>Próximo passo:</strong> vou te responder no WhatsApp pra combinarmos juntos o horário da sua <strong>sessão inicial</strong>.'
      +       '<span class="trg-info-meta">50 minutos · online · R$ 97 · pago só depois do horário fechado</span>'
      +     '</div>'
      +   '</div>'
      +   '<div class="trg-name-block">'
      +     '<label class="trg-name-label" for="trgNameInput">'
      +       '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>'
      +       'Como posso te chamar?'
      +     '</label>'
      +     '<input type="text" id="trgNameInput" class="trg-name-input" placeholder="Seu primeiro nome" maxlength="40" autocomplete="given-name" value="' + savedName + '">'
      +     '<span class="trg-name-hint">Pra eu te responder pelo nome — mais humano que um "Olá" qualquer.</span>'
      +   '</div>'
      +   '<button type="button" class="trg-final-cta" id="trgFinalCta"' + (savedName.trim().length >= 2 ? '' : ' disabled') + '>' + ICONS.wpp + ' Continuar pelo WhatsApp' + ICONS.arrowR + '</button>'
      +   '<p class="trg-final-note">Atendimento de segunda a sábado · Costumo responder em menos de 2 horas</p>'
      + '</div>';
  }
  function summaryRow(label, value) {
    return '<div class="trg-summary-row">' + ICONS.check + '<div><strong>' + escapeHtml(label) + '</strong>' + escapeHtml(value) + '</div></div>';
  }

  // ===========================================================================
  // BINDING DE EVENTOS POR ETAPA
  // ===========================================================================
  function bindStepHandlers() {
    var s = state.step;
    if (s === 1) bindStep1();
    else if (s === 2) bindStep2();
    else if (s === 3) bindStep3();
    else if (s === 4) bindStep4();
    else if (s === 5) bindStep5();
    else bindFinal();
  }

  function bindStep1() {
    var opts = document.querySelectorAll('#trgBody .trg-option');
    opts.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var v = btn.getAttribute('data-value');
        var prev = state.demanda;
        state.demanda = v;
        markSelected(opts, v);

        if (v === 'outro') {
          // Não auto-avança — abre textarea e atualiza footer com botão Continuar
          if (prev !== 'outro') {
            persist();
            renderStep();
            setTimeout(function () {
              var input = document.getElementById('trgOutroInput');
              if (input) input.focus();
            }, 120);
          }
        } else {
          // Outras demandas — limpa texto "outro" se houver e auto-avança
          state.demandaOutro = '';
          persist();
          if (prev === 'outro') {
            // Re-render pra remover o painel do outro
            renderStep();
            setTimeout(advance, AUTO_ADVANCE_MS);
          } else {
            setTimeout(advance, AUTO_ADVANCE_MS);
          }
        }
      });
    });

    var outroInput = document.getElementById('trgOutroInput');
    var outroCount = document.getElementById('trgOutroCount');
    if (outroInput) {
      outroInput.addEventListener('input', function () {
        state.demandaOutro = outroInput.value;
        if (outroCount) outroCount.textContent = outroInput.value.length;
        var next = document.getElementById('trgNext');
        if (next) next.disabled = !outroInput.value.trim();
        persist();
      });
      outroInput.addEventListener('keydown', function (e) {
        // Enter (sem shift) avança se tiver conteúdo
        if (e.key === 'Enter' && !e.shiftKey && outroInput.value.trim()) {
          e.preventDefault();
          advance();
        }
      });
    }
  }
  function bindStep2() {
    var opts = document.querySelectorAll('#trgBody .trg-option');
    opts.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var v = btn.getAttribute('data-value');
        state.tempo = v;
        markSelected(opts, v);
        persist();
        setTimeout(advance, AUTO_ADVANCE_MS);
      });
    });
  }
  function bindStep3() {
    var slider = document.getElementById('trgSlider');
    var valEl = document.getElementById('trgSliderValue');
    if (!slider) return;
    slider.addEventListener('input', function () {
      state.impacto = parseInt(slider.value, 10);
      state.impactoTouched = true;
      slider.classList.add('is-touched');
      valEl.textContent = state.impacto;
      valEl.classList.remove('is-low', 'is-mid', 'is-high');
      valEl.classList.add('is-touched', impactColorClass());
      var fb = document.querySelector('.trg-impact-feedback');
      if (fb) {
        fb.classList.remove('is-empty');
        fb.classList.remove('is-low', 'is-mid', 'is-high');
        fb.classList.add(impactColorClass());
        fb.textContent = impactFeedbackText();
      }
      var next = document.getElementById('trgNext');
      if (next) next.disabled = false;
      persist();
    });
  }
  function bindStep4() {
    var cards = document.querySelectorAll('#trgBody .trg-freq-card');
    cards.forEach(function (card) {
      card.addEventListener('click', function () {
        var v = card.getAttribute('data-value');
        handleFreqChoice(v);
      });
    });
    var keep = document.getElementById('trgDiscKeep');
    var swap = document.getElementById('trgDiscSwitch');
    if (keep) keep.addEventListener('click', function () {
      state.escolha_final_apos_disclaimer = 'manteve';
      persist();
      setTimeout(advance, 200);
    });
    if (swap) swap.addEventListener('click', function () {
      state.frequencia = 'semanal';
      state.escolha_final_apos_disclaimer = 'trocou';
      state.disclaimer_exibido = 'nenhum';
      persist();
      renderStep(); // re-render to update visual selection + remove disclaimer
      setTimeout(advance, 250);
    });
  }
  function handleFreqChoice(freq) {
    state.frequencia = freq;
    var cards = document.querySelectorAll('#trgBody .trg-freq-card');
    cards.forEach(function (c) {
      var sel = c.getAttribute('data-value') === freq;
      c.classList.toggle('is-selected', sel);
      c.setAttribute('aria-checked', sel ? 'true' : 'false');
    });

    if (freq === 'semanal') {
      state.disclaimer_exibido = 'nenhum';
      state.escolha_final_apos_disclaimer = 'n_aplica';
      persist();
      setTimeout(advance, AUTO_ADVANCE_MS);
      return;
    }

    // Quinzenal
    var sev = severityLevel();
    if (sev === 'leve') {
      state.disclaimer_exibido = 'nenhum';
      state.escolha_final_apos_disclaimer = 'n_aplica';
      persist();
      setTimeout(advance, AUTO_ADVANCE_MS);
      return;
    }

    // Moderada ou alta — mostra disclaimer e NÃO avança auto
    state.disclaimer_exibido = sev;
    state.escolha_final_apos_disclaimer = 'n_aplica';
    persist();
    renderStep();
  }
  function bindStep5() {
    var pkgs = document.querySelectorAll('#trgBody .trg-pkg-card');
    var evalBtn = document.querySelector('#trgBody .trg-only-eval');
    pkgs.forEach(function (card) {
      card.addEventListener('click', function () {
        var v = card.getAttribute('data-value');
        state.pacote = v;
        pkgs.forEach(function (c) { c.classList.toggle('is-selected', c.getAttribute('data-value') === v); });
        if (evalBtn) evalBtn.classList.remove('is-selected');
        var next = document.getElementById('trgNext');
        if (next) next.disabled = false;
        persist();
      });
    });
    if (evalBtn) {
      evalBtn.addEventListener('click', function () {
        state.pacote = 'apenas_avaliacao';
        pkgs.forEach(function (c) { c.classList.remove('is-selected'); });
        evalBtn.classList.add('is-selected');
        var next = document.getElementById('trgNext');
        if (next) next.disabled = false;
        persist();
      });
    }
  }
  function bindFinal() {
    var cta = document.getElementById('trgFinalCta');
    var nameInput = document.getElementById('trgNameInput');

    if (nameInput) {
      // Auto-focus se ainda não foi preenchido (gentle nudge)
      setTimeout(function () {
        if (!state.nome || state.nome.trim().length < 2) {
          try { nameInput.focus(); } catch (e) {}
        }
      }, 250);

      // Atualiza state a cada keystroke e habilita/desabilita o CTA
      var syncName = function () {
        var val = nameInput.value.trim();
        // Capitaliza primeira letra ao salvar (Maria, João, etc.)
        var pretty = val.length ? val.charAt(0).toUpperCase() + val.slice(1) : '';
        state.nome = pretty;
        persist();
        if (cta) {
          if (val.length >= 2) cta.removeAttribute('disabled');
          else cta.setAttribute('disabled', '');
        }
      };
      nameInput.addEventListener('input', syncName);
      // Enter envia se nome preenchido
      nameInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && nameInput.value.trim().length >= 2) {
          e.preventDefault();
          submitAndRedirect();
        }
      });
    }

    if (cta) cta.addEventListener('click', function () {
      // Validação defensiva — se chegou aqui sem nome, foca no input
      if (!state.nome || state.nome.trim().length < 2) {
        if (nameInput) {
          nameInput.focus();
          nameInput.classList.add('trg-name-input-shake');
          setTimeout(function () { nameInput.classList.remove('trg-name-input-shake'); }, 500);
        }
        return;
      }
      submitAndRedirect();
    });
  }

  function markSelected(buttons, value) {
    buttons.forEach(function (b) {
      var sel = b.getAttribute('data-value') === value;
      b.classList.toggle('is-selected', sel);
      b.setAttribute('aria-checked', sel ? 'true' : 'false');
    });
  }

  // ===========================================================================
  // NAVEGAÇÃO
  // ===========================================================================
  function advance() {
    var prevStep = state.step;
    state.step = state.step + 1;
    persist();

    // Tracking baseado no step que acabamos de ENTRAR
    if (state.step === 2) track('triagem_etapa_2');
    else if (state.step === 3) track('triagem_etapa_3');
    else if (state.step === 4) track('triagem_etapa_4');
    else if (state.step === 5) track('triagem_etapa_5');
    else if (state.step > TOTAL_STEPS) track('triagem_concluida');

    renderStep();
  }
  function goBack() {
    if (state.step <= 1) return;
    state.step = state.step - 1;
    persist();
    renderStep();
  }

  // ===========================================================================
  // SUBMIT (mensagem WhatsApp + tracking)
  // ===========================================================================
  // Helpers para construir a mensagem em tom natural (não listão de campos)
  function demandaForMessage(id) {
    if (id === 'outro') {
      var custom = (state.demandaOutro || '').trim();
      return { isCustom: true, text: custom };
    }
    for (var i = 0; i < DEMANDAS.length; i++) {
      if (DEMANDAS[i].id === id) {
        var lbl = DEMANDAS[i].label;
        // Lowercase a primeira letra pra encaixar no meio da frase
        return { isCustom: false, text: lbl.charAt(0).toLowerCase() + lbl.slice(1) };
      }
    }
    return { isCustom: false, text: 'algo que ainda quero explicar melhor' };
  }
  function tempoForMessage(id) {
    if (id === 'menos_6m') return 'há menos de 6 meses';
    if (id === '6m_2a')    return 'há algo entre 6 meses e 2 anos';
    if (id === 'mais_2a')  return 'há mais de 2 anos';
    return '';
  }
  function impactoWord(n) {
    var num = parseInt(n, 10) || 0;
    if (num <= 3)  return 'leve';
    if (num <= 6)  return 'moderado';
    return 'forte';
  }
  function pacoteInfoFor(freq, id) {
    if (!freq || !id || id === 'apenas_avaliacao') return null;
    var list = PACOTES[freq] || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) return list[i];
    }
    return null;
  }

  function buildMessage() {
    var lines = [];
    var nome = (state.nome || '').trim();

    // 1) Saudação curta + nome (gender-neutral)
    lines.push(nome
      ? ('Oi, Yuri! Sou ' + nome + ', fiz a triagem no seu site.')
      : 'Oi, Yuri! Fiz a triagem no seu site.');

    // 2) Contexto numa frase só (demanda + tempo + impacto) — qualificação enxuta
    var d = demandaForMessage(state.demanda);
    var tempo = tempoForMessage(state.tempo);
    var imp = parseInt(state.impacto, 10) || 0;
    if (d.isCustom && d.text) {
      lines.push('Tô lidando com ' + d.text + ' ' + tempo + ' (impacto ' + imp + '/10).');
    } else if (d.isCustom) {
      lines.push('Tem algo que prefiro te contar pessoalmente (impacto ' + imp + '/10).');
    } else {
      lines.push('O que mais tem me pegado é ' + d.text + ' ' + tempo + ' (impacto ' + imp + '/10).');
    }

    // 3) Próximo passo — curto e direto (sessão inicial como porta de entrada)
    if (state.pacote === 'apenas_avaliacao' || !pacoteInfoFor(state.frequencia, state.pacote)) {
      lines.push('Queria começar pela sessão inicial de avaliação (R$ 97). Me avisa um horário que dê pra você?');
    } else {
      lines.push('Queria começar pela sessão inicial de avaliação (R$ 97), pensando em seguir ' + (state.frequencia === 'quinzenal' ? 'quinzenal' : 'semanal') + ' depois. Me avisa um horário que dê pra você?');
    }

    return lines.join('\n');
  }

  function getPacoteObj() {
    if (!state.frequencia || !state.pacote || state.pacote === 'apenas_avaliacao') return null;
    var list = PACOTES[state.frequencia] || [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === state.pacote) return list[i];
    }
    return null;
  }

  function submitAndRedirect() {
    var msg = buildMessage();
    var url = 'https://wa.me/' + PHONE + '?text=' + encodeURIComponent(msg);

    // Define o tipo de lead: escolheu pacote = QUALIFICADO; só avaliação = AVALIAÇÃO
    var pkg = getPacoteObj();
    var isQualificado = !!pkg;
    var value = pkg ? pkg.total : 97;

    track('whatsapp_clicado_apos_triagem', {
      redirected_to_whatsapp: true,
      lead_tipo: isQualificado ? 'qualificado' : 'avaliacao',
      lead_valor: value
    });

    // Mark completed e limpa storage (não queremos restaurar uma sessão concluída)
    state.completed = true;
    clearSaved();

    // Dispara a conversão certa (com fallback de redirect embutido em cada função)
    setTimeout(function () {
      if (isQualificado && typeof window.yzr_conv_qualificado === 'function') {
        window.yzr_conv_qualificado(url, value);
      } else if (!isQualificado && typeof window.yzr_conv_avaliacao === 'function') {
        window.yzr_conv_avaliacao(url);
      } else if (typeof window.gtag_report_conversion === 'function') {
        window.gtag_report_conversion(url);
      } else {
        var newWin = window.open(url, '_blank', 'noopener');
        if (!newWin) window.location.href = url;
      }
    }, 250);

    showSubmittedFeedback();
  }

  function showSubmittedFeedback() {
    var body = document.getElementById('trgBody');
    if (!body) return;
    body.innerHTML = ''
      + '<div class="trg-step">'
      +   '<div class="trg-final-head" style="padding: 3rem 0 2rem;">'
      +     '<div class="trg-final-orb">' + ICONS.check + '</div>'
      +     '<h2>Pronto! <em>Te vejo no WhatsApp.</em></h2>'
      +     '<p>Se nada acontecer, toque no botão verde de WhatsApp ou volte e tente novamente.</p>'
      +   '</div>'
      + '</div>';
    var footer = document.getElementById('trgFooter');
    if (footer) footer.style.display = 'none';
    var close = document.getElementById('trgClose');
    if (close) close.style.display = 'none';
  }

  // ===========================================================================
  // INTERCEPTOR DE CLIQUES WA.ME
  // ===========================================================================
  function interceptWAClick(e) {
    if (e.defaultPrevented) return;
    if (e.button !== 0) return;
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;

    var link = e.target.closest && e.target.closest('a[href*="wa.me"], a[href*="api.whatsapp.com/send"]');
    if (!link) return;
    if (link.closest('#trgModal')) return;
    if (link.hasAttribute('data-yzr-skip')) return;

    e.preventDefault();
    e.stopImmediatePropagation();
    openModal(link.href, link);
  }

  // ===========================================================================
  // INIT
  // ===========================================================================
  function init() {
    document.addEventListener('click', interceptWAClick, true);
    // Expor para acesso manual via onclick se quiser
    window.openTriagem = function () { openModal('', null); };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
